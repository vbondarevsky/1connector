name: Тестирование
on: [push, pull_request, workflow_dispatch, workflow_call]

permissions:
  contents: read

jobs:
  test:
    uses: autumn-library/workflows/.github/workflows/test.yml@v1
    with:
      oscript_version: default
      opm_version: '1.7.1'
      dotnet_version: '8.0.x'
      os_versions: '["ubuntu-22.04", "windows-2022", "macos-15"]'
      build_package: true
