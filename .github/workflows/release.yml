name: Подготовка релиза и публикация в хабе
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Проверка версии релиза
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/.*\.Версия("\([0-9.]*\)").*/\1/p' packagedef)
          test -n "$version"
          test "$RELEASE_TAG" = "v$version"
  tests:
    needs: validate
    uses: ./.github/workflows/tests.yml
  quality:
    needs: validate
    uses: ./.github/workflows/qa.yml
    secrets: inherit
  publish:
    needs: [tests, quality]
    uses: autumn-library/workflows/.github/workflows/release.yml@v1
    with:
      oscript_version: default
      opm_version: '1.7.1'
      dotnet_version: '8.0.x'
      os_version: ubuntu-22.04
      package_mask: 1connector-*.ospx
    secrets:
      PUSH_TOKEN: ${{ secrets.OSHUB_TOKEN }}
  attach:
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: package.zip
          path: package
      - name: Загрузка пакета в GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          packages=(package/1connector-*.ospx)
          test "${#packages[@]}" = 1
          test "${packages[0]}" = "package/1connector-${RELEASE_TAG#v}.ospx"
          gh release upload "$RELEASE_TAG" "${packages[0]}"
